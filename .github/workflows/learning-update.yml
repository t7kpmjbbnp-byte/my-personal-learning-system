
name: Learning Update

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: learning-update-main
  cancel-in-progress: false

jobs:
  update-learning-records:
    if: startsWith(github.event.issue.title, '[LEARNING UPDATE]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and save learning update
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');

            const issue = context.payload.issue;
            const id = issue.number;
            const body = issue.body || '';
            // ==========================================
            // 1. READ LEARNING METADATA
            // ==========================================

            const metadata = {
              subject: body.match(/^SUBJECT:\s*(.+)$/m)?.[1]?.trim() || '',
              topic: body.match(/^TOPIC:\s*(.+)$/m)?.[1]?.trim() || '',
              updateType: body.match(/^UPDATE_TYPE:\s*(.+)$/m)?.[1]?.trim().toUpperCase() || '',
              competency: body.match(/^COMPETENCY:\s*(.+)$/m)?.[1]?.trim() || '',
              masteryLevel: body.match(/^MASTERY_LEVEL:\s*(UNKNOWN|[0-5])$/m)?.[1] || ''
            };


            // ==========================================
            // 2. DEFINE ALLOWED VALUES
            // ==========================================

            const allowedTypes = [
              'PROGRESS',
              'MISTAKE',
              'REVIEW',
              'CLINICAL_CASE'
            ];

            const validCompetencies = metadata.competency
              .split(',')
              .map(item => item.trim().toUpperCase())
              .filter(item => /^C[1-6]$/.test(item));


            // ==========================================
            // 3. VALIDATE METADATA
            // ==========================================

            const metadataErrors = [];

            if (!metadata.subject) {
              metadataErrors.push('Missing SUBJECT');
            }

            if (!metadata.topic) {
              metadataErrors.push('Missing TOPIC');
            }

            if (!allowedTypes.includes(metadata.updateType)) {
              metadataErrors.push('Invalid UPDATE_TYPE');
            }

            if (!metadata.masteryLevel) {
              metadataErrors.push('MASTERY_LEVEL must be UNKNOWN or 0-5');
            }

            if (validCompetencies.length === 0) {
              metadataErrors.push('COMPETENCY must contain at least one valid value from C1-C6');
            }


            // ==========================================
            // 4. STOP IF METADATA IS INVALID
            // ==========================================

            if (metadataErrors.length > 0) {

              const errorMessage = [
                'Learning metadata is invalid:',
                ...metadataErrors.map(error => `- ${error}`)
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: errorMessage
              });

              core.setFailed(errorMessage);

              return;
            }
            const routes = [
              {
                heading: 'CURRENT_STATE',
                path: '02_PROGRESS/CURRENT_STATE.md',
                title: `Cập nhật tiến độ — Issue #${id}`
              },
              {
                heading: 'MISTAKES',
                path: '02_PROGRESS/MISTAKES.md',
                title: `Ghi nhận lỗi sai — Issue #${id}`
              },
              {
                heading: 'REVIEW_HISTORY',
                path: '02_PROGRESS/REVIEW_HISTORY.md',
                title: `Lịch sử ôn tập — Issue #${id}`
              },
              {
                heading: 'CLINICAL_CASES',
                path: '01_SUBJECTS/NOI_CO_SO_RHM_CTUMP/CLINICAL_CASES.md',
                title: `Ca lâm sàng — Issue #${id}`
              }
            ];

            const lines = body.split(/\r?\n/);

            function getSection(name) {
              const heading = `## ${name}`;
              const start = lines.findIndex(
                line => line.trim() === heading
              );

              if (start === -1) return '';

              let end = lines.length;

              for (let i = start + 1; i < lines.length; i++) {
                if (/^##\s+/.test(lines[i].trim())) {
                  end = i;
                  break;
                }
              }

              return lines.slice(start + 1, end).join('\n').trim();
            }

            const sections = routes.map(route => ({
              ...route,
              content: getSection(route.heading)
            }));

            const invalid = sections
              .filter(section => !section.content)
              .map(section => section.heading);

            if (invalid.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: id,
                body:
                  '⚠️ Chưa lưu dữ liệu vì Issue thiếu mục hoặc mục đang để trống: ' +
                  invalid.join(', ') +
                  '. Hãy bổ sung đủ bốn mục rồi tạo Issue mới với tiêu đề bắt đầu bằng [LEARNING UPDATE].'
              });

              core.setFailed('Learning update validation failed.');
              return;
            }

            const date = new Date(issue.created_at).toLocaleString(
              'vi-VN',
              { timeZone: 'Asia/Ho_Chi_Minh' }
            );

            const marker = `<!-- learning-update-issue-${id} -->`;
            const changed = [];

            for (const section of sections) {
              const file = section.path;
              const old = fs.existsSync(file)
                ? fs.readFileSync(file, 'utf8')
                : '';

              if (old.includes(marker)) {
                core.info(`Issue #${id} already saved in ${file}`);
                continue;
              }

              fs.mkdirSync(path.dirname(file), {
                recursive: true
              });

              const entry =
                `\n\n${marker}\n` +
                `## ${section.title}\n` +
                `**Ngày:** ${date}\n\n` +
                `${section.content}\n`;

              fs.appendFileSync(file, entry, 'utf8');
              changed.push(file);
            }

            if (changed.length > 0) {
              execFileSync('git', [
                'config', 'user.name', 'github-actions[bot]'
              ]);

              execFileSync('git', [
                'config', 'user.email',
                '41898282+github-actions[bot]@users.noreply.github.com'
              ]);

              execFileSync('git', ['add', '--', ...changed]);

              execFileSync('git', [
                'commit', '-m',
                `Save learning update from issue #${id}`
              ]);
              execFileSync('git', ['pull', '--rebase', 'origin', 'main']);
              execFileSync('git', ['push']);

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: id,
                body: '✅ Đã kiểm tra đủ bốn mục và lưu thành công vào:\n' +
                  changed.map(file => `- ${file}`).join('\n')
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: id,
                body: 'ℹ️ Bốn mục đã hợp lệ nhưng dữ liệu của Issue này đã được lưu trước đó. Không tạo bản ghi trùng.'
              });
            }
