
name: Learning Update

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update-learning-records:
    if: startsWith(github.event.issue.title, '[LEARNING UPDATE]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Classify and save learning update
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');

            const issue = context.payload.issue;
            const id = issue.number;
            const body = issue.body || '(Không có nội dung)';
            const date = new Date(issue.created_at).toLocaleString(
              'vi-VN',
              { timeZone: 'Asia/Ho_Chi_Minh' }
            );

            const marker = `<!-- learning-update-issue-${id} -->`;
            const changed = [];

            function appendOnce(path, content) {
              let old = fs.existsSync(path)
                ? fs.readFileSync(path, 'utf8')
                : '';

              if (old.includes(marker)) {
                core.info(`Issue #${id} already saved in ${path}`);
                return;
              }

              fs.mkdirSync(require('path').dirname(path), {
                recursive: true
              });

              fs.appendFileSync(
                path,
                `\n\n${marker}\n${content}\n`,
                'utf8'
              );

              changed.push(path);
            }

                        function getSection(name) {
              const lines = body.split(/\r?\n/);
              const heading = `## ${name}`;
              const start = lines.findIndex(
                line => line.trim() === heading
              );

              if (start === -1) return '';

              let end = lines.length;

              for (let i = start + 1; i < lines.length; i++) {
                if (/^##\s+/.test(lines[i])) {
                  end = i;
                  break;
                }
              }

              return lines.slice(start + 1, end).join('\n').trim();
            }
                heading: 'REVIEW_HISTORY',
                path: '02_PROGRESS/REVIEW_HISTORY.md',
                title: `Lịch sử ôn tập — Issue #${id}`
              },
              {
                heading: 'CLINICAL_CASES',
                path: '01_SUBJECTS/NOI_CO_SO_RHM_CTUMP/CLINICAL_CASES.md',
                title: `Ca lâm sàng — Issue #${id}`
              }
            ];

            for (const route of routes) {
              const section = getSection(route.heading);

              if (section) {
                appendOnce(
                  route.path,
                  `## ${route.title}\n**Ngày:** ${date}\n\n${section}`
                );
              }
            }

            if (changed.length > 0) {
              execFileSync('git', [
                'config', 'user.name', 'github-actions[bot]'
              ]);
              execFileSync('git', [
                'config', 'user.email',
                '41898282+github-actions[bot]@users.noreply.github.com'
              ]);

              execFileSync('git', ['add', '--', ...changed]);
              execFileSync('git', [
                'commit', '-m',
                `Save learning update from issue #${id}`
              ]);
              execFileSync('git', ['push']);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: id,
              body: changed.length
                ? `Đã lưu nội dung vào: ${changed.join(', ')}.`
                : 'Nội dung Issue này đã được lưu trước đó; không tạo bản ghi trùng.'
            });
